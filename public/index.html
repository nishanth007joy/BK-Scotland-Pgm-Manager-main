<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible Kalothsavam - Scotland 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="/branding.js" defer></script>
</head>
<body>
  <main class="container d-flex align-items-center min-vh-100 py-4">
    <section class="card shadow-sm border-0 mx-auto" style="max-width: 28rem; width: 100%;">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 text-center mb-2">Bible Kalothsavam - Scotland 2026</h1>
        <p class="text-secondary text-center mb-4">Sign in to continue</p>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="username">Username or email address</label>
            <input class="form-control form-control-lg" type="text" id="username" autocomplete="username" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control form-control-lg" type="password" id="password" autocomplete="current-password" aria-describedby="passwordHint">
            <div id="passwordHint" class="form-text">Results board accounts do not need a password. All other accounts require a password.</div>
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
        </form>
        <div id="message" class="alert mt-4 mb-0 d-none" role="alert"></div>
        <p id="adminRegistration" class="small text-center text-secondary mt-4 mb-0 d-none"><a href="/register.html">Create an account</a></p>
      </div>
    </section>
  </main>

  <script>
    function showMessage(text, type) {
      const message = document.getElementById('message');
      message.textContent = text;
      message.className = `alert mt-4 mb-0 alert-${type}`;
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const submitButton = e.currentTarget.querySelector('button[type="submit"]');

      if (!username.trim()) {
        showMessage('Enter your username or email address.', 'danger');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Signing in…';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();
        showMessage(result.message || 'An unexpected response was received.', response.ok ? 'success' : 'danger');
        if (response.ok && result.user && result.user.isAdmin) {
          document.getElementById('adminRegistration').classList.remove('d-none');
        }
        if (response.ok) window.location.assign(result.user?.role === 'resultboard' || String(result.user?.name || '').trim().toLowerCase() === 'resultboard' ? '/results-display.html' : '/home.html');
      } catch (error) {
        showMessage('Unable to contact the server. Open this page at http://localhost:3000, not directly from the file system.', 'danger');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
