<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Current event name</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
  <main id="panel" class="container py-5 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><h1 class="h3 mb-1">Current event name</h1><p id="eventLabel" class="text-secondary mb-0"></p></div>
      <div class="text-end"><a class="small me-2" href="/home.html">Home</a><span id="signedInAs" class="small text-secondary d-block"></span><button class="btn btn-sm btn-outline-secondary" type="button" data-logout>Logout</button></div>
    </div>
    <section class="card shadow-sm border-0"><div class="card-body p-4">
      <p class="text-secondary" id="nameHelp">Set the event name displayed throughout the application. Other pages show the new name when reloaded.</p>
      <form id="eventForm">
        <label class="form-label" for="currentEventName">Current event name</label>
        <input class="form-control mb-3" id="currentEventName" name="currentEventName" type="text" maxlength="200" required aria-describedby="nameHelp" disabled>
        <button id="save" class="btn btn-primary" type="submit" disabled>Save event name</button>
      </form>
      <div id="message" class="mt-3" role="status" aria-live="polite">Loading current event name...</div>
    </div></section>
  </main>
  <main id="accessDenied" class="container py-5"><h1 class="h4">Administrator access required</h1><p id="accessMessage">Checking your session...</p><a href="/">Sign in</a></main>
  <script src="/logout.js"></script>
  <script src="/current-event.js"></script>
</body>
</html>
