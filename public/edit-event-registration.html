<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Single Event Registrations | Bible Kalothsavam - Scotland 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="/branding.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <main id="editPanel" class="container py-5 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><h1 class="h3 mb-1">Edit Single Event Registrations</h1><p class="text-secondary mb-0">Bible Kalothsavam - Scotland 2026</p></div>
      <div class="text-end"><a class="small me-3" href="/edit-group-registration.html">Edit group event registration</a><a class="small me-2" href="/home.html">Home</a><a class="small" href="/event-registrations.html">Single Event Registrations</a><span id="signedInAs" class="small text-secondary d-block"></span><button class="btn btn-sm btn-outline-secondary ms-2" type="button" data-logout>Logout</button></div>
    </div>
    <section class="card shadow-sm border-0"><div class="card-body p-4">
      <label class="form-label" for="registrationPicker">Registration</label>
      <div class="position-relative mb-4">
        <input class="form-select" id="registrationPicker" type="text" role="combobox" autocomplete="off" aria-autocomplete="list" aria-expanded="false" aria-controls="registrationResults" placeholder="Loading registrations..." disabled>
        <div id="registrationResults" class="list-group position-absolute w-100 shadow bg-white" role="listbox" aria-label="Matching registrations" style="z-index:1000;max-height:18rem;overflow-y:auto" hidden></div>
      </div>
      <form id="editForm" class="d-none">
        <div class="row g-3"><div class="col-md-6"><label class="form-label" for="EventID">Event</label><select class="form-select" id="EventID" required></select></div><div class="col-md-6"><label class="form-label" for="ContestantID">Contestant</label><select class="form-select" id="ContestantID" required></select></div><div class="col-12"><label class="form-label" for="Comments">Comments</label><input class="form-control" id="Comments" maxlength="50"></div></div><p class="text-secondary mt-3">Event and contestant details are updated automatically on save. Registrations with results cannot be changed.</p>
        <button class="btn btn-primary mt-4" id="save" type="submit">Save changes</button>
      </form>
      <div id="message" class="alert mt-3 mb-0 d-none" role="alert"></div>
    </div></section>
  </main>
  <main id="accessDenied" class="container py-5"><h1 class="h4">Sign-in required</h1><p id="accessMessage">Checking your session...</p></main>
  <script src="/logout.js"></script>
  <script src="/edit-event-registration.js"></script>
</body>
</html>
