<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit event | Bible Kalothsavam - Scotland 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="/branding.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <main id="editPanel" class="container py-5 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><h1 class="h3 mb-1">Edit event details</h1><p class="text-secondary mb-0">Bible Kalothsavam - Scotland 2026</p></div>
      <div class="text-end"><a class="small me-2" href="/home.html">Home</a><a class="small" href="/event-list.html">All events</a><span id="signedInAs" class="small text-secondary d-block"></span><button class="btn btn-sm btn-outline-secondary ms-2" type="button" data-logout>Logout</button></div>
    </div>
    <section class="card shadow-sm border-0"><div class="card-body p-4">
      <label class="form-label" for="eventPicker">Event</label>
      <input class="form-control" id="eventPicker" list="eventOptions" autocomplete="off" placeholder="Type to find an event" aria-describedby="eventPickerHelp" disabled>
      <datalist id="eventOptions"></datalist>
      <p id="eventPickerHelp" class="form-text mb-4">Type an event name, age group, ID, type or stage, then select a matching event to edit.</p>
      <form id="editForm" class="d-none">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label" for="EventID">Event ID</label><input class="form-control" id="EventID" placeholder="Assigned automatically on save" readonly></div>
          <div class="col-md-4"><label class="form-label" for="EventName">Event name</label><input class="form-control" id="EventName" maxlength="50" required></div>
          <div class="col-md-4"><label class="form-label" for="EventAgeGroup">Age group</label><select class="form-select" id="EventAgeGroup" required><option value="">Select an age range</option></select></div>
          <div class="col-md-4"><label class="form-label" for="IndividualGroup">Individual or group</label><select class="form-select" id="IndividualGroup" required><option value="">Select a type</option><option value="Individual">Individual</option><option value="Group">Group</option></select></div>
          <div class="col-md-4"><label class="form-label" for="OnStageOffStage">Stage</label><select class="form-select" id="OnStageOffStage" required><option value="">Select a stage</option><option value="OnStage">On stage</option><option value="OffStage">Off stage</option></select></div>
          <div class="col-md-4"><label class="form-label" for="Comments">Comments (optional)</label><input class="form-control" id="Comments" maxlength="50"></div>
        </div>
        <p class="text-secondary mt-3 mb-0">For events with registrations, only comments can be changed.</p>
        <button class="btn btn-primary mt-4" id="save" type="submit">Save changes</button>
      </form>
      <div id="message" class="alert mt-3 mb-0 d-none" role="alert"></div>
    </div></section>
  </main>
  <main id="accessDenied" class="container py-5"><h1 class="h4">Sign-in required</h1><p id="accessMessage">Checking your session...</p></main>
  <script src="/logout.js"></script>
  <script src="/edit-event.js"></script>
</body>
</html>
