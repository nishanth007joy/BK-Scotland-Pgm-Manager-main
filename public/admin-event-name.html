<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update event name | Bible Kalothsavam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <script src="/branding.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <div class="d-flex justify-content-between mb-4"><h1 class="h3">Update event name</h1><a href="/home.html">Home</a></div>
    <p id="accessMessage" role="status">Checking administrator access...</p>
    <section id="panel" class="card card-body d-none">
      <label for="eventPicker" class="form-label">Event</label>
      <input id="eventPicker" class="form-control mb-3" list="eventOptions" placeholder="Type an event name, age group or ID" autocomplete="off" disabled>
      <datalist id="eventOptions"></datalist>
      <form id="renameForm">
        <label for="eventName" class="form-label">New event name</label>
        <input id="eventName" class="form-control" maxlength="50" required disabled>
        <p class="form-text">Updates the selected event ID and its linked entries. Age groups, scores and places stay unchanged.</p>
        <button id="reviewButton" class="btn btn-primary" disabled>Review all entries</button>
      </form>
      <section id="review" class="d-none mt-4" aria-labelledby="reviewHeading">
        <h2 id="reviewHeading" class="h4">Confirm event name update</h2>
        <p id="changeSummary"></p>
        <div id="details"></div>
        <p>Confirm to update the event name in all entries listed above, including approved and published results.</p>
        <button id="confirmButton" class="btn btn-danger" type="button">Confirm and update all entries</button>
        <button id="cancelButton" class="btn btn-outline-secondary" type="button">Cancel</button>
      </section>
      <div id="message" class="mt-3" role="status"></div>
    </section>
  </main>
  <script src="/admin-event-name.js"></script>
</body>
</html>
