<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results pending printing | Bible Kalothsavam - Scotland 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="/branding.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <main id="panel" class="container py-5 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><h1 class="h3 mb-1">Events pending results printing</h1><p class="text-secondary mb-0">Published events and age groups with results marked No.</p></div>
      <div class="text-end"><a class="small me-2" href="/home.html">Home</a><a class="small" href="/published-results.html">Published results</a><span id="signedInAs" class="small text-secondary d-block"></span><button class="btn btn-sm btn-outline-secondary" type="button" data-logout>Logout</button></div>
    </div>
    <section class="card shadow-sm border-0"><div class="card-body p-4">
      <button class="btn btn-outline-primary mb-3" id="reload" type="button">Refresh</button>
      <div id="message" class="alert alert-danger d-none" role="alert"></div>
      <p id="listStatus" role="status">Loading results...</p>
      <div class="table-responsive"><table class="table align-middle">
        <thead><tr><th scope="col">Event name</th><th scope="col">Age group</th><th scope="col">Results pending printing</th><th scope="col">Action</th></tr></thead>
        <tbody id="events"></tbody>
      </table></div>
    </div></section>
  </main>
  <main id="accessDenied" class="container py-5"><h1 class="h4">Sign-in required</h1><p id="accessMessage">Checking your session...</p></main>
  <script src="/logout.js"></script>
  <script src="/unprinted-results.js"></script>
</body>
</html>
