<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset user password | Bible Kalothsavam - Scotland 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="/branding.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><h1 class="h3">Reset user password</h1></div>
      <div><a href="/home.html">Home</a><button class="btn btn-sm btn-outline-secondary ms-2" type="button" data-logout>Logout</button></div>
    </div>
    <p id="status" role="status">Checking administrator access...</p>
    <form id="resetForm" class="card card-body d-none" style="max-width:32rem">
      <label for="user" class="form-label">User</label>
      <select id="user" class="form-select mb-3" required><option value="">Select a user</option></select>
      <label for="password" class="form-label">New password</label>
      <input id="password" class="form-control mb-3" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
      <label for="confirmPassword" class="form-label">Confirm new password</label>
      <input id="confirmPassword" class="form-control mb-3" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
      <p>Use at least 8 characters. The user will be signed out and must use this new password. Share it with them securely.</p>
      <button id="resetButton" class="btn btn-primary" type="submit">Reset password</button>
    </form>
  </main>
  <script src="/logout.js"></script>
  <script src="/reset-password.js"></script>
</body>
</html>
