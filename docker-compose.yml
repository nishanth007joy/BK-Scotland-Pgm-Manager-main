services:
  postgres:
    image: postgres:16
    container_name: bk-scotland-postgres
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD:-LocalDev!2026Pg}"
      POSTGRES_USER: "${DB_USER:-pgrm_user}"
      POSTGRES_DB: "${DB_NAME:-bk_scotland}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pgrm_user} -d ${DB_NAME:-bk_scotland}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
